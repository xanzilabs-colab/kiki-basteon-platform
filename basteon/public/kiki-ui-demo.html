<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F4F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kiki Connect — UI review demo (v5)</title>
  <style>
    :root {
      color-scheme: light;
      --plum: #4A2472;
      --plum-dark: #35194F;
      --lavender: #EEE8F6;
      --paper: #F8F4EC;
      --surface: #FFFDF9;
      --ink: #29231F;
      --muted: #756D66;
      --pink: #EC7AAE;
      --peach: #FCE9DF;
      --green: #BFDFBF;
      --green-ink: #315B37;
      --line: #E8DED3;
      --shadow: 0 16px 42px rgba(53, 25, 79, .08);
      --radius: 20px;
      --nav-width: 264px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; width: var(--nav-width);
      flex-direction: column; border-right: 1px solid var(--line); background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 22px 22px 18px; }
    .brand-mark { display: grid; width: 42px; height: 42px; flex: none; place-items: center; border-radius: 15px; background: var(--plum); color: white; font-size: 21px; font-weight: 900; box-shadow: 0 7px 16px #4A247229; }
    .brand-copy { display: grid; gap: 2px; }
    .brand-copy strong { color: var(--plum-dark); font-size: 13px; letter-spacing: .12em; }
    .brand-copy small { color: var(--muted); font-size: 10px; }
    .demo-badge { margin: 0 16px 14px; border: 1px solid #f1c4d7; border-radius: 12px; background: #fff3f8; padding: 9px 11px; color: #773a59; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .workspace { display: flex; gap: 7px; padding: 0 14px 14px; }
    .workspace button { min-width: 0; flex: 1; border: 1px solid transparent; border-radius: 10px; background: transparent; padding: 8px 4px; color: var(--muted); font-size: 10px; font-weight: 750; }
    .workspace button.active { border-color: var(--line); background: var(--lavender); color: var(--plum); }
    .nav-scroll { overflow: auto; flex: 1; padding: 3px 12px 18px; scrollbar-width: thin; }
    .nav-group { margin: 10px 0 19px; }
    .nav-heading { padding: 0 11px 7px; color: #998d82; font-size: 9px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .nav-item { display: flex; width: 100%; align-items: center; gap: 11px; min-height: 40px; margin: 2px 0; border: 0; border-radius: 11px; background: transparent; padding: 0 11px; color: #665c54; text-align: left; font-size: 12px; font-weight: 650; transition: background .15s, color .15s; }
    .nav-item:hover { background: var(--peach); color: var(--plum-dark); }
    .nav-item.active { background: var(--lavender); color: var(--plum); font-weight: 800; }
    .nav-icon { display: grid; width: 21px; flex: none; place-items: center; font-size: 15px; }
    .nav-label { overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
    .nav-count { border-radius: 99px; background: var(--peach); padding: 3px 7px; color: #8d5c4d; font-size: 9px; font-weight: 850; }
    .side-user { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 14px 16px; }
    .avatar { display: grid; width: 36px; height: 36px; flex: none; place-items: center; border-radius: 13px; background: var(--peach); color: var(--plum); font-weight: 850; }
    .side-user-copy { display: grid; min-width: 0; flex: 1; gap: 3px; }
    .side-user-copy b { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .side-user-copy small { color: var(--muted); font-size: 9px; }
    .side-user button { border: 0; background: transparent; color: var(--muted); font-size: 17px; }
    .main { min-height: 100vh; margin-left: var(--nav-width); }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; min-height: 70px; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); background: #F8F4ECed; padding: 0 30px; backdrop-filter: blur(14px); }
    .mobile-menu { display: none; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 18px; }
    .crumb { display: grid; min-width: 0; gap: 3px; }
    .crumb small { color: var(--muted); font-size: 10px; }
    .crumb strong { overflow: hidden; color: var(--plum-dark); font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .top-spacer { flex: 1; }
    .search { display: flex; width: min(250px, 24vw); align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 9px 11px; color: var(--muted); }
    .search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 11px; }
    .top-action { position: relative; display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 16px; }
    .notification-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border: 1px solid white; border-radius: 50%; background: var(--pink); }
    .top-profile { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; }
    .top-profile .avatar { width: 34px; height: 34px; }
    .top-profile span:last-child { display: grid; gap: 2px; text-align: left; }
    .top-profile b { font-size: 10px; }
    .top-profile small { color: var(--muted); font-size: 9px; }
    .content { width: min(100%, 1420px); margin: 0 auto; padding: 29px 30px 60px; }
    .demo-notice { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 23px; border: 1px solid #f2c5d8; border-radius: 13px; background: #fff5f9; padding: 11px 14px; color: #754052; font-size: 10px; line-height: 1.5; }
    .demo-notice b { color: #62223f; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 23px; }
    .eyebrow { margin: 0 0 7px; color: var(--plum); font-size: 9px; font-weight: 900; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: clamp(24px, 3vw, 34px); font-weight: 850; letter-spacing: -.045em; line-height: 1.12; }
    .page-subtitle { max-width: 680px; margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .head-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .btn { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 0 13px; color: var(--ink); font-size: 10px; font-weight: 800; transition: .15s; }
    .btn:hover { border-color: #d3bce4; background: var(--lavender); color: var(--plum); }
    .btn-primary { border-color: var(--plum); background: var(--plum); color: white; }
    .btn-primary:hover, .btn-primary:active { border-color: var(--plum-dark); background: var(--plum-dark); color: white; }
    .btn-soft { border-color: transparent; background: var(--lavender); color: var(--plum); }
    .btn-danger { border-color: #a4404e; background: #a4404e; color: white; }
    .btn-success { border-color: #b1d0b1; background: var(--green); color: var(--green-ink); }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 17px; }
    .stat, .card { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 4px 16px rgba(53, 25, 79, .035); }
    .stat { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 17px; }
    .stat-label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .stat-value { display: block; margin-top: 8px; color: var(--plum-dark); font-size: 25px; font-weight: 850; letter-spacing: -.04em; }
    .stat-note { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .stat-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 12px; background: var(--lavender); color: var(--plum); font-size: 16px; }
    .dashboard-grid { grid-template-columns: minmax(0, 1.55fr) minmax(260px, .85fr); align-items: start; }
    .card { padding: 18px; }
    .card + .card { margin-top: 15px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .card-head h2, .card-head h3 { margin: 0; color: var(--plum-dark); font-size: 13px; font-weight: 850; }
    .card-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .text-link { border: 0; background: transparent; padding: 4px; color: var(--plum); font-size: 10px; font-weight: 800; }
    .hero-card { position: relative; overflow: hidden; border-color: #e9d7c9; background: linear-gradient(120deg, #FCE9DF 0%, #FFFDF9 66%); padding: 22px; }
    .hero-card::after { position: absolute; top: -50px; right: -40px; width: 220px; height: 220px; border: 1px solid #EC7AAE38; border-radius: 50%; box-shadow: 0 0 0 22px #EC7AAE0b, 0 0 0 48px #EC7AAE09; content: ""; }
    .hero-card h2 { position: relative; z-index: 1; max-width: 520px; margin: 0; color: var(--plum-dark); font-size: 20px; letter-spacing: -.03em; }
    .hero-card p { position: relative; z-index: 1; max-width: 510px; margin: 8px 0 15px; color: #6d5e55; font-size: 11px; line-height: 1.6; }
    .hero-bottom { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); padding: 6px 9px; color: #655b54; font-size: 9px; font-weight: 800; white-space: nowrap; }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #65a36f; }
    .pill.pink { border-color: #f0bdd2; background: #fff3f8; color: #7f3e5b; }
    .pill.orange { border-color: #edc9b5; background: var(--peach); color: #76533f; }
    .map { position: relative; min-height: 245px; overflow: hidden; border: 1px solid #e6ddd0; border-radius: 16px; background-color: #eff0e5; background-image: linear-gradient(33deg, transparent 47%, #fffdf9 47.5%, #fffdf9 50%, transparent 50.5%), linear-gradient(145deg, transparent 34%, #fffdf9 34.5%, #fffdf9 37%, transparent 37.5%), linear-gradient(85deg, transparent 58%, #fffdf9 58.5%, #fffdf9 61%, transparent 61.5%), repeating-linear-gradient(0deg, #dfe6d7 0 1px, transparent 1px 42px), repeating-linear-gradient(90deg, #dfe6d7 0 1px, transparent 1px 52px); }
    .map::before { position: absolute; inset: 12% 25% 19% 34%; border: 1px solid #cadec7; border-radius: 45% 36% 42% 28%; background: #e6eddc; content: ""; transform: rotate(-17deg); }
    .map::after { position: absolute; top: 17%; right: 9%; width: 25%; height: 28%; border-radius: 48%; background: #e1eddb; content: ""; transform: rotate(20deg); }
    .map-label { position: absolute; z-index: 1; color: #74806b; font-size: 8px; font-weight: 700; letter-spacing: .04em; }
    .map-label.one { top: 25%; left: 8%; }.map-label.two { right: 11%; bottom: 23%; }.map-label.three { bottom: 13%; left: 37%; }
    .map-road { position: absolute; z-index: 1; height: 8px; border: 2px solid #f9f8f2; border-width: 2px 0; background: #d3c7b1; transform-origin: left center; }
    .road-one { top: 65%; left: -4%; width: 112%; transform: rotate(-21deg); }.road-two { top: 6%; left: 63%; width: 85%; transform: rotate(74deg); }
    .map-marker { position: absolute; z-index: 2; display: grid; width: 34px; height: 34px; place-items: center; border: 3px solid white; border-radius: 50% 50% 50% 3px; background: var(--plum); color: white; font-size: 12px; box-shadow: 0 3px 10px #35194f44; transform: rotate(-45deg); }
    .map-marker span { transform: rotate(45deg); }
    .marker-me { top: 48%; left: 48%; background: #EC7AAE; }.marker-a { top: 25%; left: 28%; }.marker-b { top: 63%; right: 22%; background: #708d6c; }
    .map-controls { position: absolute; z-index: 3; top: 10px; right: 10px; display: grid; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: white; }
    .map-controls button { width: 30px; height: 29px; border: 0; border-bottom: 1px solid var(--line); background: white; font-weight: 850; }
    .map-controls button:last-child { border-bottom: 0; }
    .map-legend { position: absolute; z-index: 3; right: 10px; bottom: 10px; border: 1px solid var(--line); border-radius: 9px; background: #fffdf9eF; padding: 7px 9px; color: var(--muted); font-size: 8px; }
    .quick-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .quick-action { display: flex; min-height: 72px; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px; text-align: left; transition: .15s; }
    .quick-action:hover { border-color: #dec7eb; background: var(--lavender); }
    .quick-icon { display: grid; width: 35px; height: 35px; flex: none; place-items: center; border-radius: 12px; background: var(--lavender); color: var(--plum); font-size: 16px; }
    .quick-action span:last-child { display: grid; gap: 4px; }
    .quick-action b { font-size: 10px; }.quick-action small { color: var(--muted); font-size: 9px; line-height: 1.3; }
    .list { display: grid; gap: 0; }
    .list-row { display: flex; align-items: center; gap: 11px; border-bottom: 1px solid #f1ece5; padding: 12px 0; }
    .list-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .list-row:first-child { padding-top: 0; }
    .list-icon { display: grid; width: 36px; height: 36px; flex: none; place-items: center; border-radius: 13px; background: var(--peach); font-size: 16px; }
    .list-copy { display: grid; min-width: 0; flex: 1; gap: 4px; }
    .list-copy b { overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .list-copy small { color: var(--muted); font-size: 9px; }
    .list-end { text-align: right; }
    .list-end b { display: block; font-size: 10px; }.list-end small { color: var(--muted); font-size: 8px; }
    .section-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .feature-card { position: relative; min-height: 145px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 17px; text-align: left; transition: .15s; }
    .feature-card:hover { border-color: #d9c6e8; transform: translateY(-2px); box-shadow: var(--shadow); }
    .feature-card .feature-icon { display: grid; width: 39px; height: 39px; place-items: center; border-radius: 14px; background: var(--lavender); color: var(--plum); font-size: 18px; }
    .feature-card h3 { margin: 13px 0 5px; color: var(--plum-dark); font-size: 13px; }
    .feature-card p { max-width: 390px; margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .feature-card > small { position: absolute; top: 18px; right: 16px; color: var(--muted); font-size: 9px; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #F8F4EC; color: var(--muted); font-size: 8px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    th, td { padding: 12px 13px; white-space: nowrap; }
    td { border-top: 1px solid #f1ece5; font-size: 10px; }
    td small { display: block; margin-top: 3px; color: var(--muted); font-size: 8px; }
    .status { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; background: var(--lavender); padding: 5px 8px; color: var(--plum); font-size: 8px; font-weight: 850; }
    .status.green { background: #e8f2e5; color: var(--green-ink); }
    .status.orange { background: var(--peach); color: #8b5b39; }
    .status.pink { background: #fff0f6; color: #8c4665; }
    .setting-row { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #f0ebe4; padding: 14px 0; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-copy { flex: 1; }
    .setting-copy b { display: block; font-size: 11px; }
    .setting-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; border: 0; border-radius: 99px; background: #ddd6cf; transition: .18s; }
    .switch::after { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #0002; content: ""; transition: .18s; }
    .switch[aria-checked="true"] { background: var(--plum); }.switch[aria-checked="true"]::after { transform: translateX(18px); }
    .profile-hero { display: flex; align-items: center; gap: 16px; border: 1px solid #ead8c9; border-radius: 18px; background: linear-gradient(120deg, var(--peach), var(--surface)); padding: 17px; }
    .profile-hero .avatar { width: 62px; height: 62px; border: 3px solid white; border-radius: 21px; font-size: 22px; }
    .profile-hero h2 { margin: 0 0 4px; color: var(--plum-dark); font-size: 16px; }.profile-hero p { margin: 0; color: var(--muted); font-size: 10px; }
    .profile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
    .field { display: grid; gap: 6px; color: #655c55; font-size: 9px; font-weight: 800; }
    .field input, .field select { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 10px; color: var(--ink); font-size: 10px; }
    .avatar-row { display: flex; align-items: center; gap: 8px; }
    .avatar-chip { display: grid; width: 34px; height: 34px; place-items: center; border: 2px solid white; border-radius: 50%; background: var(--lavender); font-size: 14px; box-shadow: 0 2px 7px #35194f18; }
    .game-board { display: grid; width: min(100%, 440px); aspect-ratio: 1; margin: 15px auto; place-items: center; border: 1px solid var(--line); border-radius: 23px; background: linear-gradient(145deg, #f8f2e7, #f2e7d8); padding: 20px; }
    .board-grid { display: grid; width: 100%; aspect-ratio: 1; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); border: 3px solid #5b3b64; border-radius: 4px; background: linear-gradient(90deg, transparent 49.5%, #805c86 49.5% 50.5%, transparent 50.5%), linear-gradient(0deg, transparent 49.5%, #805c86 49.5% 50.5%, transparent 50.5%); }
    .board-grid span { display: grid; place-items: center; color: var(--plum); font-size: 24px; }
    .board-grid span:nth-child(3n) { color: #cb638f; }
    .game-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px; }
    .game-status b { font-size: 10px; }.game-status small { color: var(--muted); font-size: 9px; }
    .journal-preview { min-height: 230px; border: 1px solid #e9d8c8; border-radius: 18px; background: linear-gradient(145deg, #FCE9DF, #FFFDF9); padding: 22px; }
    .journal-preview h2 { margin: 8px 0; color: var(--plum-dark); font-size: 18px; }.journal-preview p { color: #685e55; font-size: 11px; line-height: 1.7; }
    .timeline { position: relative; display: grid; gap: 13px; margin: 4px 0 0 7px; padding-left: 19px; }
    .timeline::before { position: absolute; top: 7px; bottom: 9px; left: 4px; width: 2px; background: var(--line); content: ""; }
    .timeline-item { position: relative; border: 1px solid var(--line); border-radius: 13px; background: white; padding: 11px; }
    .timeline-item::before { position: absolute; top: 14px; left: -20px; width: 9px; height: 9px; border: 2px solid white; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 1px var(--pink); content: ""; }
    .timeline-item b { font-size: 10px; }.timeline-item p { margin: 4px 0 0; color: var(--muted); font-size: 9px; }
    .game-room { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; }
    .safety-panel { border: 1px solid #ecc1ce; border-radius: 16px; background: #fff4f7; padding: 15px; }
    .safety-panel h3 { margin: 0 0 7px; color: #823d55; font-size: 12px; }.safety-panel p { margin: 0; color: #765965; font-size: 9px; line-height: 1.5; }
    .empty { display: grid; min-height: 190px; place-items: center; border: 1px dashed #dccfbe; border-radius: 15px; background: #fffdfa; padding: 18px; text-align: center; }
    .empty span { font-size: 26px; }.empty h3 { margin: 8px 0 4px; color: var(--plum-dark); font-size: 12px; }.empty p { max-width: 340px; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .bottom-nav { display: none; }
    .backdrop { position: fixed; inset: 0; z-index: 40; display: none; background: #21172d77; backdrop-filter: blur(2px); }
    .backdrop.open { display: block; }
    .sheet { position: fixed; z-index: 41; right: 0; bottom: 0; left: 0; max-height: 86vh; overflow: auto; border-radius: 22px 22px 0 0; background: var(--surface); padding: 20px 18px max(24px, env(safe-area-inset-bottom)); box-shadow: 0 -12px 40px #21172d22; transform: translateY(105%); transition: transform .24s ease; }
    .backdrop.open .sheet { transform: translateY(0); }

/* ==========================================================================
   KIKI CONNECT — iOS SUBSTANCE SKIN (v3)
   Inset-grouped surfaces, SF-style type, frosted bars, system controls.
   Markup/behaviour unchanged; this layer re-skins everything.
   ========================================================================== */
:root {
  --plum: #4A2472; --plum-dark: #2B1448; --plum-soft: rgba(74,36,114,.10); --plum-soft-2: rgba(74,36,114,.16);
  --lavender: #EFEAF6; --paper: #F2F2F7; --surface: #FFFFFF;
  --ink: #111114; --muted: #6B6A73; --line: #DCDCE1; --sep: rgba(60,60,67,.18);
  --pink: #8A5BC0; --peach: #F2F2F7; --green: #34C759; --green-ink: #17703A;
  --blue: #2F6FDE; --orange: #E8890C; --red: #E5262B;
  --ios-shadow: 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.05), 0 8px 22px rgba(0,0,0,.06);
  --ios-shadow-lift: 0 0 0 .5px rgba(60,60,67,.12), 0 2px 4px rgba(0,0,0,.06), 0 14px 30px rgba(0,0,0,.10);
  --radius: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
  letter-spacing: -.011em;
}
body { background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { -webkit-tap-highlight-color: transparent; }
button:active { opacity: .72; }
h1, h2, h3 { letter-spacing: -.022em; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid rgba(74,36,114,.45); outline-offset: 2px; }

/* ---------- Sidebar (iPadOS source list, dark) ---------- */
.sidebar { background: #1A1028; border-right: 0; }
.brand { min-height: 80px; border-bottom: .5px solid rgba(255,255,255,.14); }
.brand-copy strong { font-size: 15px; font-weight: 700; letter-spacing: .06em; color: #fff; }
.brand-copy small { font-size: 10px; color: #A99CBD; font-weight: 600; letter-spacing: .08em; }

.nav-scroll { padding: 8px 12px; }

.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; box-shadow: none; }
.nav-icon { border: 0; border-radius: 8px; background: transparent; color: #CDBFE0; width: 28px; height: 28px; }
.nav-item.active .nav-icon { color: #fff; }
.nav-icon svg { width: 21px; height: 21px; stroke-width: 1.7; }
.desktop-actions { padding: 12px 14px 16px; }
.desktop-actions button { min-height: 48px; border: 0; border-radius: 12px; background: rgba(255,255,255,.10); font-size: 16px; font-weight: 600; }
.desktop-actions .send-sos { background: var(--red); box-shadow: none; }

/* ---------- Top bar (frosted nav bar) ---------- */
.topbar { min-height: 64px; background: rgba(249,249,252,.80); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px); border-bottom: .5px solid rgba(60,60,67,.22); box-shadow: none; }
.top-profile .avatar { width: 38px; height: 38px; border: 0; border-radius: 50%; background: linear-gradient(160deg, #6B3DA3, #3A1B5F); font-size: 15px; font-weight: 700; }
.top-profile b { font-size: 15px; font-weight: 600; color: var(--ink); }
.top-action { width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(120,120,128,.14); color: var(--ink); }
.top-action svg { width: 18px; height: 18px; }
.notification-dot { width: 9px; height: 9px; top: 5px; right: 5px; background: var(--red); border: 2px solid #F5F5F9; }

/* ---------- Page chrome ---------- */
.content { padding-top: 26px; }

/* ---------- Surfaces ---------- */

.device-actions, .device-metrics article, .spot-card, .game-row, .trip-callout, .feature-card, .quick-action, .member-detail-card,

}

/* ---------- Buttons ---------- */

.status.orange { background: rgba(232,137,12,.17); color: #9A5800; }

/* ---------- Hero ---------- */

/* ---------- Tab bar ---------- */

      $("#content").innerHTML = `${pageHeader(activePage)}${renderScreen(activePage)}`;
      renderNav(); renderBottomNav();
      $("#content").querySelectorAll("[data-page]").forEach((button) => button.addEventListener("click", () => setPage(button.dataset.page)));
    }
    function openMenu() {
      $("#sheet-title").textContent = activeWorkspace === "member" ? "More" : "Explore Kiki";
      const options = [
        ["trips", "Trips", "Route Watch and Travel Together", "route"],
        ["safe-spots", "Safe spots & reports", "Browse spots and community reports", "pin"],
        ["games", "Stoep", "Unwind and play", "game"],
        ["calm", "Calm", "Breathing, noticing, and body check-ins", "flower"],
        ["journal", "Journal", "Your private garden", "journal"],
        ["guardians", "Guardians", "Your private Guardian Circle", "shield"],
        ["safety-call", "Safety call", "Start a discreet in-app call", "phone"]
      ];
      const memberOptions = options.map(([id,label,detail,glyph]) => `<button class="more-option" ${id === "safety-call" ? 'data-action="safety-call"' : `data-sheet-page="${id}" data-sheet-role="member"`}><span class="nav-icon">${icon(glyph,17)}</span><span><b>${label}</b><small>${detail}</small></span>${icon("chevron",17)}</button>`).join("");
      const portalOptions = Object.entries(workspaceLabels).filter(([role]) => role !== "member").map(([role,label]) => `<button class="more-option" data-sheet-page="${workspaces[role][0][1][0]}" data-sheet-role="${role}"><span class="nav-icon">${icon("shield",17)}</span><span><b>${escapeHtml(label)} portal preview</b><small>Demo-only view of a separate console</small></span>${icon("chevron",17)}</button>`).join("");
      const otherOptions = activeWorkspace === "member" ? `<div class="nav-heading demo-portals-heading">OTHER PORTAL PREVIEWS · DEMO ONLY</div>${portalOptions}` : `<div class="nav-heading demo-portals-heading">DEMO PORTALS</div><button class="more-option" data-sheet-page="overview" data-sheet-role="member"><span class="nav-icon">${icon("home",17)}</span><span><b>Member app preview</b><small>Return to the fictional member experience</small></span>${icon("chevron",17)}</button>${workspaces[activeWorkspace].flatMap(([, ids]) => ids).map((id) => `<button class="more-option" data-sheet-page="${id}" data-sheet-role="${activeWorkspace}"><span class="nav-icon">${icon(iconForPage(id),17)}</span><span><b>${escapeHtml(title(id))}</b><small>${escapeHtml(info(id)[1])}</small></span>${icon("chevron",17)}</button>`).join("")}`;
      $("#sheet-content").innerHTML = activeWorkspace === "member" ? `${memberOptions}${otherOptions}` : otherOptions;
      $("#backdrop").classList.add("open");
      $("#sheet-content").querySelectorAll("[data-sheet-page]").forEach((button) => button.addEventListener("click", () => setWorkspacePage(button.dataset.sheetRole, button.dataset.sheetPage)));
    }
    $("#content").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.action === "toggle") {
        button.setAttribute("aria-checked", button.getAttribute("aria-checked") === "true" ? "false" : "true");
        showToast("Demo preference changed locally. Nothing was saved.");
      } else if (button.dataset.action === "mock-action") {
        showToast("Demo preview only — no action was sent or saved.");
      } else if (button.dataset.action === "map-zoom") {
        showToast("The map is an illustration, not a live map.");
      } else if (button.dataset.action === "responders") {
        $("#sheet-title").textContent = "Responders nearby";
        $("#sheet-content").innerHTML = `<p class="page-subtitle">From official partner organisations · 6 currently on duty</p><div class="list">${listRow("✚","City Response team","Community responder · Parkview","",["2.1 km","green"])}${listRow("✚","Rosebank Support","First-aid responder · Rosebank","",["3.4 km","green"])}</div><p class="spot-note">Location data is fictional in this prototype. No location permission is requested.</p>`;
        $("#backdrop").classList.add("open");
      } else if (button.dataset.tab) {
        selectedTab = button.dataset.tab; render();
      }
    });
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button || $("#content").contains(button)) return;
      if (button.dataset.action === "menu") openMenu();
      if (button.dataset.action === "close-sheet") {
        $("#backdrop").classList.remove("open"); $("#sidebar").classList.remove("open");
      }
      if (button.dataset.action === "notifications") {
        $("#sheet-title").textContent = "Notifications";
        $("#sheet-content").innerHTML = `<div class="list">${listRow("♡","Jayden accepted your buddy invite","Today · 10:34","",["Example","green"])}${listRow("⌖","Walk check-in complete","Today · 08:56","",["Example","green"])}${listRow("✿","A new Calm tool is ready","Yesterday · 17:20","",["Example","green"])}</div>`;
        $("#backdrop").classList.add("open");
      }
      if (button.dataset.action === "profile-menu") {
        activeWorkspace = "member"; setPage("profile");
      }
      if (button.dataset.action === "safety-call") {
        $("#sheet-title").textContent = "Safety call";
        $("#sheet-content").innerHTML = `<div class="call-preview"><span>${icon("phone",30)}</span><p>SAFETY CALL</p><h3>Kiki Care</h3><small>Mock check-in · no call will be placed</small><button class="btn btn-primary" type="button" data-action="mock-action">Preview call screen</button></div>`;
        $("#backdrop").classList.add("open");
      }
      if (button.dataset.action === "sos") {
        $("#sheet-title").textContent = "Emergency alert";
        $("#sheet-content").innerHTML = `<div class="sos-preview"><span>${icon("shieldAlert",32)}</span><h3>Emergency alert</h3><p>Your active Kiki device and available phone location would be shared with authorised responders.</p><div class="trip-tabs"><button type="button" aria-pressed="true" data-action="mock-action">SOS</button><button type="button" aria-pressed="false" data-action="mock-action">Medical</button></div><div class="sos-countdown">3 <small>Sending SOS in</small></div><button class="btn btn-primary" type="button" data-action="mock-action">Send immediately now</button><button class="btn" type="button" data-action="close-sheet">Cancel emergency alert</button><small>Demo only · nothing will be sent</small></div>`;
        $("#backdrop").classList.add("open");
      }
      if (button.dataset.action === "refresh") showToast("Demo refreshed. No account data was loaded.");
      if (button.dataset.action === "signout") showToast("Sign out is unavailable in this no-login demo.");
      if (button.dataset.action === "safety-status") showToast("No live safety alerts in this fictional demo.");
    });
    $("#navigation").addEventListener("click", (event) => {
      const button = event.target.closest("[data-page]");
      if (button) setPage(button.dataset.page);
    });
    setPage("overview");
  </script>

<script>
/* iOS finish: swap decorative unicode glyphs for line icons (no markup/logic changes). */
(() => {
  const map = {
    "♡":"heart","⌖":"pin","◷":"clock","⌁":"route","⌘":"settings","⚙":"settings","◈":"shield","▣":"devices",
    "＋":"plus","✓":"check","≈":"wind","⌕":"search","◎":"heart","♙":"profile","◉":"game","✿":"flower","❋":"flower",
    "✎":"journal","▤":"journal","▦":"organization","≡":"journal","✚":"plus","♧":"shieldAlert","♫":"bell","◌":"profile",
    "↔":"refresh","↗":"arrow","↻":"refresh","☕":"home","•":"pin","⌂":"home","🚨":"shieldAlert","🚶":"route","🚕":"devices","🚆":"route","☁":"journal","🦋":"heart"
  };
  const tiles = ".list-icon,.feature-icon,.stat-icon,.quick-icon,.game-icon,.journal-entry-token";
  let queued = false;
  function decorate() {
    queued = false;
    document.querySelectorAll(tiles).forEach(el => {
      if (el.querySelector("svg")) return;
      const t = el.textContent.trim();
      if (map[t]) el.innerHTML = icon(map[t], 19);
    });

    if (typeof activeWorkspace !== "undefined" && activeWorkspace !== "member") {
      const nm = [["alert","shieldAlert"],["device","devices"],["trigger","route"],["setting","settings"],["config","settings"],["user","profile"],["member","profile"],["organisation","organization"],["responder","plus"],["buddies","heart"],["beneficiar","heart"],["moderation","journal"],["roster","journal"],["places","pin"],["history","clock"],["link","refresh"],["overview","home"],["dashboard","home"]];
      document.querySelectorAll(".nav-item[data-page]").forEach(el => {
        const id = el.dataset.page; const hit = nm.find(([k]) => id.includes(k));
        const box = el.querySelector(".nav-icon"); if (hit && box) box.innerHTML = icon(hit[1], 21);
      });
    }
    document.querySelectorAll(".btn,.text-link").forEach(el => {
      if (el.querySelector("svg")) return;
      const t = el.textContent.trim(), first = [...t][0];
      if (first && map[first] && t.length > 1 && t[first.length] === " ") {
        el.innerHTML = icon(map[first], 17) + " " + el.textContent.trim().slice(first.length).trim();
      } else if (t.startsWith("•••")) {
        el.innerHTML = el.textContent.replace("•••", "").trim() || "More";
      }
    });
  }
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(decorate); } };
  new MutationObserver(queue).observe(document.body, { childList: true, subtree: true });
  decorate();
})();
</script>
